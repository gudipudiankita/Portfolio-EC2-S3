name: Terraform S3 Portfolio CI-CD

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      operation:
        description: "Choose Terraform operation"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      confirm_destroy:
        description: "Enter DESTROY to confirm"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_IN_AUTOMATION: true

    steps:
      # 1. Check out the repository containing Terraform code
      - name: Checkout Terraform repository
        uses: actions/checkout@v4
        with:
          path: terraform-code

      # 2. Check out the portfolio repository
      - name: Checkout portfolio repository
        uses: actions/checkout@v4
        with:
          repository: https://github.com/gudipudiankita/Portfolio-EC2-S3/tree/main/portfolio
          ref: main
          path: terraform-code/portfolio

      # 3. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # 5. Verify files exist before Terraform validation
      - name: Check portfolio files
        working-directory: terraform-code
        run: |
          ls -l portfolio/index.html
          ls -l portfolio/ankita.png

      # 6. Terraform commands
      - name: Terraform Init
        working-directory: terraform-code
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform-code
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.operation == 'apply'
        working-directory: terraform-code
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || inputs.operation == 'apply'
        working-directory: terraform-code
        run: terraform apply -input=false -auto-approve tfplan

      - name: Display Outputs
        if: github.event_name == 'push' || inputs.operation == 'apply'
        working-directory: terraform-code
        run: |
          echo "## Portfolio Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Bucket ARN: $(terraform output -raw portfolio_bucket_arn)" >> "$GITHUB_STEP_SUMMARY"
          echo "Image URL: $(terraform output -raw portfolio_image_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Website URL: $(terraform output -raw portfolio_s3_website_url)" >> "$GITHUB_STEP_SUMMARY"

      # 7. Require confirmation for destroy
      - name: Check Destroy Confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "Destroy cancelled: enter DESTROY to confirm."
          exit 1

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirm_destroy == 'DESTROY'
        working-directory: terraform-code
        run: terraform destroy -input=false -auto-approve
