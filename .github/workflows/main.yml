
name: EC2 S3 Portfolio CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      operation:
        description: "Choose Terraform operation"
        type: choice
        options:
          - apply
          - destroy
        default: apply
        required: true

      confirm_destroy:
        description: "Type DESTROY to confirm deletion"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: portfolio-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.operation == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || inputs.operation == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Display S3 Outputs
        if: github.event_name == 'push' || inputs.operation == 'apply'
        run: |
          BUCKET_ARN="$(terraform output -raw portfolio_bucket_arn)"
          IMAGE_URL="$(terraform output -raw portfolio_image_url)"
          S3_WEBSITE_URL="$(terraform output -raw portfolio_s3_website_url)"

          {
            echo "## S3 Portfolio Deployment"
            echo ""
            echo "**Bucket ARN:** \`${BUCKET_ARN}\`"
            echo ""
            echo "[Open Profile Image](${IMAGE_URL})"
            echo ""
            echo "[Open S3 Website](${S3_WEBSITE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Bucket ARN: ${BUCKET_ARN}"
          echo "Image URL: ${IMAGE_URL}"
          echo "S3 Website URL: ${S3_WEBSITE_URL}"

      - name: Check Destroy Confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "Destroy cancelled. Enter DESTROY to confirm."
          exit 1

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' && inputs.confirm_destroy == 'DESTROY'
        run: terraform destroy -input=false -auto-approve
